<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menú digital · Opciones</title>
  <style>
    body { margin: 0; padding: 2rem 1.25rem; font-family: system-ui, sans-serif; background: #f3f6f9; color: #12294a; line-height: 1.5; }
    main { max-width: 34rem; margin: 0 auto; }
    h1 { font-size: 2rem; margin: 0 0 .5rem; }
    a.opcion { display: block; margin-top: 1rem; padding: 1.25rem; border-radius: 14px; background: #12294a; color: #fff; text-decoration: none; }
    a.opcion strong { display: block; font-size: 1.2rem; }
    a.opcion span { color: #c8d6ea; }

  </style>
</head>
<body>
  <main>
    <h1>Menú digital</h1>
    <p>Elegí una opción para ver cómo queda en tu celular.</p>
    <a class="opcion" href="demo-simple/"><strong>Opción 1 · Menú digital</strong><span>El menú completo, fácil de leer, con un QR para todo el local.</span></a>
    <a class="opcion" href="demo-pedidos/?mesa=1"><strong>Opción 2 · Menú con pedidos por mesa</strong><span>Cada mesa arma su pedido y lo envía por WhatsApp.</span></a>
  </main>

</html>
